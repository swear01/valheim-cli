[package]
name = "valheim-agent-cli"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "Local Valheim agent CLI"
authors = ["Huang Ssu-Wei"]
license = "MIT"
publish = false
repository = "https://github.com/swear01/valheim-cli"

[lib]
path = "cli/lib.rs"

[[bin]]
name = "valheim"
path = "cli/main.rs"

[dependencies]
base64 = "0.22.1"
getrandom = "0.4.2"
serde_json = "1.0.150"
sha2 = "0.10.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
overflow-checks = true
